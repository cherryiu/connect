quarkus.application.name=users-service

# MongoDB
quarkus.mongodb.connection-string=${QUARKUS_MONGODB_CONNECTION_STRING}
quarkus.mongodb.database=coze

# OpenAPI
quarkus.swagger-ui.always-include=true

# user-friend-service
quarkus.http.port=8081

# setting form login page to empty so quarkus doesnt redirect unauth API requests
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=

# protecting APIs 
quarkus.http.auth.permission.public.paths=/q/*,/j_security_check,/auth/status
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/users/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# cross origin resource sharing (not sure if super needed??)
quarkus.http.cors.enabled=true
# react app url
quarkus.http.cors.origins=http://localhost:3000 
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true